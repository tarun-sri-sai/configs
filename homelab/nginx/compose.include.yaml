include:
  - ../immich/compose.include.yaml
  - ../llama/compose.include.yaml
  - ../seaweedfs/compose.include.yaml
  - ../forgejo/compose.include.yaml
  - ../nextcloud/compose.include.yaml

services:
  nginx:
    depends_on:
      - immich-server
      - s3
      - forgejo
      - llama-server
      - nextcloud
    hostname: nginx
    image: docker.io/library/nginx:1.30-alpine
    networks:
      - nginx_net
    ports:
      - "3000:3000"
      - "2283:2283"
      - "8333:8333"
      - "8080:8080"
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  nginx_net:
    internal: true
