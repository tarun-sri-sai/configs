services:
  llama-server:
    command: -hf google/gemma-4-E4B-it-qat-q4_0-gguf:Q4_0 --alias Gemma-4-E4B -c 32768 -n 32768 -ngl 999 -fa on -ctk q8_0 -ctv q4_0 -lv 4 -np 1 --no-mmproj --jinja --chat-template-kwargs '{"reasoning_effort":"low"}' --sleep-idle-seconds 900
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN}
    hostname: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10630@sha256:c50a38601c8bbb6dcb2fdbe60ee336faea7c7c7e11a1d5a6396993783617d911
    networks:
      - llama_net
    restart: unless-stopped
    volumes:
      - ${MODELS_PATH}:/models

  bifrost:
    depends_on:
      - llama-server
    env_file:
      - .env
    hostname: bifrost
    image: docker.io/maximhq/bifrost:v2.1.1-amd64@sha256:6faa9c041af1d7c53888630cc8e152bdfb8df381179a330a5ef60c57d25ebde8
    networks:
      - llama_net
      - nginx_net
    restart: unless-stopped
    volumes:
      - ${BIFROST_DATA}:/app/data

  open-webui:
    depends_on:
      - bifrost
      - open-terminal
    env_file:
      - .env
    hostname: open-webui
    image: ghcr.io/open-webui/open-webui:0.11.4-slim@sha256:0487ad4a5a4b986062dedace806c3ef1e88fec38c10d1e64d6a5501c66671e5e
    networks:
      - llama_net
      - nginx_net
      - open-terminal_net
    restart: unless-stopped
    volumes:
      - ${OPEN_WEBUI_DATA}:/app/backend/data

  open-terminal:
    env_file:
      - .env
    hostname: open-terminal
    image: ghcr.io/open-webui/open-terminal:0.14.0-slim@sha256:ba7a67129bbaf8618887eb6283d7e351275e2838c0751bbafebbce6b22938687
    networks:
      - open-terminal_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  llama_net:
  open-terminal_net:
    internal: true
