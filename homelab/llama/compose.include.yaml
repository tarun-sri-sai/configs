services:
  llama-server:
    command: -hf google/gemma-4-E4B-it-qat-q4_0-gguf:Q4_0 --alias Gemma-4-E4B -c 32768 -n 32768 -ngl 999 -fa on -ctk q8_0 -ctv q4_0 -lv 4 -np 2 --no-mmproj --jinja --chat-template-kwargs '{"reasoning_effort":"low"}' --sleep-idle-seconds 900
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN}
    hostname: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10630
    networks:
      - llama_net
    restart: unless-stopped
    volumes:
      - ${MODELS_PATH}:/models

  bifrost:
    depends_on:
      - llama-server
    env_file:
      - .env
    hostname: bifrost
    image: docker.io/maximhq/bifrost:v2.1.1-amd64
    networks:
      - llama_net
      - nginx_net
    restart: unless-stopped
    volumes:
      - ${BIFROST_DATA}:/app/data

  open-webui:
    depends_on:
      - bifrost
      - open-terminal
    env_file:
      - .env
    hostname: open-webui
    image: ghcr.io/open-webui/open-webui:0.11.4
    networks:
      - llama_net
      - nginx_net
      - open-terminal_net
    restart: unless-stopped
    volumes:
      - ${OPEN_WEBUI_DATA}:/app/backend/data

  open-terminal:
    env_file:
      - .env
    hostname: open-terminal
    image: ghcr.io/open-webui/open-terminal:0.14.0-slim
    networks:
      - open-terminal_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  llama_net:
  open-terminal_net:
    internal: true
