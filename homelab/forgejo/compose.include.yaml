include:
  - ../postgres/compose.include.yaml

services:
  forgejo:
    depends_on:
      - postgres
    env_file:
      - .env
    hostname: forgejo
    image: codeberg.org/forgejo/forgejo:16@sha256:7c4e1db440be7b2ca685b49d0d7864cdd78e92431f531bf7893659def8200fc5
    networks:
      - postgres_net
      - nginx_net
    restart: unless-stopped
    volumes:
      - ${FORGEJO_DATA}:/data
