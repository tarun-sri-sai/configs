include:
  - ../postgres/compose.include.yaml

services:
  nextcloud:
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    hostname: nextcloud
    image: docker.io/library/nextcloud:34@sha256:8e5f49801db0cf4659b3089ce1917728023bb8cba7f93731f2abbdfe3a18df0a
    networks:
      - postgres_net
      - nginx_net
      - redis_net
    restart: unless-stopped
    volumes:
      - ${NEXTCLOUD_DATA}:/var/www/html
