services:
  master:
    image: docker.io/chrislusf/seaweedfs:4.42
    hostname: master
    command: master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324
    expose:
      - "9333"
      - "19333"
      - "9324"
    volumes:
      - ${SEAWEEDFS_MASTER}:/data

  volume:
    image: docker.io/chrislusf/seaweedfs:4.42
    hostname: volume
    command: volume -ip=volume -master="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325
    depends_on:
      - master
    expose:
      - "8080"
      - "18080"
      - "9325"
    volumes:
      - ${SEAWEEDFS_VOLUME}:/data

  filer:
    image: docker.io/chrislusf/seaweedfs:4.42
    hostname: filer
    command: filer -ip=filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326
    depends_on:
      - master
      - volume
    expose:
      - "8888"
      - "18888"
      - "9326"
    volumes:
      - ${SEAWEEDFS_FILER}:/data

  s3:
    image: docker.io/chrislusf/seaweedfs:4.42
    hostname: s3
    command: s3 -filer="filer:8888" -ip.bind=0.0.0.0 -metricsPort=9327
    depends_on:
      - master
      - volume
      - filer
    env_file: .env
    expose:
      - "8333"
      - "9327"
