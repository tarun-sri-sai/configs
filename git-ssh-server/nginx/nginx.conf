events {}

http {
    client_max_body_size 0;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    server {
        listen 443 ssl;
        server_name myserver.local;

        ssl_certificate     /etc/nginx/certs/combined.crt;
        ssl_certificate_key /etc/nginx/certs/combined.key;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_pass http://gitea:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name seaweedfs.myserver.local;

        ssl_certificate     /etc/nginx/certs/combined.crt;
        ssl_certificate_key /etc/nginx/certs/combined.key;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_pass http://filer:8888;
        }
    }

    server {
        listen 443 ssl;
        server_name s3.myserver.local;

        ssl_certificate     /etc/nginx/certs/combined.crt;
        ssl_certificate_key /etc/nginx/certs/combined.key;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://s3:8333;
        }
    }
}
